<!doctype html>
<!-- The picture a shared link shows in posts. To remake site/og.png, take a
     1200x630 screenshot of this page with headless Chrome. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Geist"; src: url(../src/story/fonts/geist-normal.woff2) format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Newsreader"; src: url(../src/story/fonts/newsreader-italic.woff2) format("woff2"); font-style: italic; }
html, body { margin: 0; }
body {
  width: 1200px; height: 630px; overflow: hidden;
  display: grid; grid-template-columns: 560px 1fr; align-items: center; gap: 56px;
  padding: 0 80px; box-sizing: border-box;
  background: radial-gradient(120% 90% at 50% -20%, rgba(255, 255, 255, 0.08), transparent 60%), #1D1E21;
  color: #F1F1EF; font-family: "Geist", sans-serif;
}
.keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.key {
  aspect-ratio: 1; display: grid; place-items: center; border-radius: 22px;
  font-size: 54px; font-weight: 500;
  background: linear-gradient(#36383D, #2C2E32);
  box-shadow: 0 9px 0 #131416, 0 22px 40px rgba(0, 0, 0, 0.45), inset 0 1.5px 0 rgba(255, 255, 255, 0.12);
}
.key.lit { color: #1D1E21; background: linear-gradient(#F6F6F3, #E4E4E0); box-shadow: 0 9px 0 #8E8F8C, 0 22px 40px rgba(0, 0, 0, 0.45); }
h1 { margin: 0 0 18px; font-size: 76px; font-weight: 650; letter-spacing: -0.035em; line-height: 0.98; }
p { margin: 0; font: italic 36px/1.25 "Newsreader", serif; color: #A4A6AC; }
small { display: block; margin-top: 36px; font-size: 24px; font-weight: 500; color: #70737A; }
</style>
</head>
<body>
  <div class="keys">
    <div class="key">t</div><div class="key">e</div><div class="key">h</div><div class="key lit">?</div>
    <div class="key">d</div><div class="key">o</div><div class="key">n</div><div class="key">e</div>
  </div>
  <div>
    <h1>Agent Wrapped 2026</h1>
    <p>A year with AI coding agents, played back in keyboard keys.</p>
    <small>npx agent-wrapped</small>
  </div>
</body>
</html>
